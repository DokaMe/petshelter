upstream petshelter_nika {
    server unix:/run/petshelter-nika/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name nika.romanenko-coding.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/petshelter-nika-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://nika.romanenko-coding.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nika.romanenko-coding.ru;
    ssl_certificate /etc/letsencrypt/live/nika.romanenko-coding.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nika.romanenko-coding.ru/privkey.pem;

    root /srv/petshelter-nika/current/frontend/dist;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /media/ {
        alias /srv/petshelter-nika/shared/media/;
        expires 1h;
    }

    location ^~ /static/ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://petshelter_nika;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
