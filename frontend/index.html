<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Полный метч</title>
        <link rel="icon" type="image/png" href="/static/cat.png">
    </head>
    <body>
        <header class="site-header">
            <div class="site-header__inner">
                <a class="site-brand" href="/"><img src="/static/cat.png" alt="">Полный метч</a>
                <nav class="site-nav" aria-label="Разделы">
                    <button id="openWards" type="button">Мои подопечные</button>
                    <button id="btnToOpenChat" aria-controls="chatCont" aria-expanded="false" type="button">Помочь с выбором</button>
                </nav>
            </div>
        </header>
        <main class="site-catalog">
            <h1>Питомцы приютов</h1>
            <p id="catalogStatus" role="status"></p>
            <button id="catalogRetry" class="text-btn hidden" type="button">Повторить загрузку</button>
            <div id="catalogList" class="pet-list"></div>
        </main>
        <section id="chatCont" class="botHidden" aria-labelledby="chatTitle">
            <div class="crug n-1"></div>
            <div class="crug n-2"></div>
            <div class="chatContentWrapper">
                <div class="botHeader">
                    <h2 id="chatTitle">Помощник по выбору</h2>
                    <div class="header-buttons">
                        <button id="restartBot" data-request-control class="closeBtn" type="button" title="Начать заново" aria-label="Начать заново">⟳</button>
                        <button id="fullScreen" class="iconBtn" type="button" title="Развернуть" aria-label="Развернуть" aria-pressed="false">⛶</button>
                        <button id="closeChat" class="closeBtn" type="button" aria-label="Закрыть чат">×</button>
                    </div>
                </div>
                <div class="chatBody">
                    <aside class="sidebar">
                        <h3>Ваш путь</h3>
                        <ul class="steps">
                            <li class="active" aria-current="step" id="stepReg">01 Регистрация</li>
                            <li id="stepSurv">02 Анкета</li>
                            <li id="stepPodb">03 Подбор питомца</li>
                            <li id="stepOfr">04 Оформление</li>
                        </ul>
                    </aside>
                    <div class="chatMain">
                        <form id="regForm" class="regForm">
                            <h3 id="authTitle">Давайте познакомимся!</h3>
                            <p id="authIntro">Чтобы начать подбор, нам нужно знать, как с вами связаться.</p>
                            <fieldset id="registrationFields">
                                <input type="text" name="first_name" aria-label="Имя" placeholder="Ваше имя *" autocomplete="given-name" maxlength="150" required>
                                <input type="text" name="last_name" aria-label="Фамилия" placeholder="Ваша фамилия *" autocomplete="family-name" maxlength="150" required>
                                <input type="tel" name="phone" aria-label="Телефон" placeholder="Номер телефона *" autocomplete="tel" maxlength="30" required>
                                <input type="text" name="city" aria-label="Город" placeholder="Город проживания *" autocomplete="address-level2" maxlength="100" required>
                                <input type="email" name="email" aria-label="Электронная почта" placeholder="Электронная почта *" autocomplete="email" maxlength="254" required>
                                <input type="text" name="telegram" aria-label="Telegram" placeholder="Telegram (необязательно)" maxlength="100">
                            </fieldset>
                            <input type="text" name="username" aria-label="Логин" placeholder="Логин *" autocomplete="username" maxlength="150" required>
                            <input type="password" name="password" aria-label="Пароль" placeholder="Пароль (от 8 символов) *" autocomplete="new-password" minlength="8" required>
                            <p id="authError" class="form-error hidden" role="alert"></p>
                            <button id="regSubmit" data-request-control class="submit-btn" type="submit">Зарегистрироваться</button>
                            <button id="authToggle" data-request-control class="text-btn" type="button">Уже есть аккаунт? Войти</button>
                        </form>
                        <div id="account" class="account hidden">
                            <div class="account-tabs" role="tablist" aria-label="Личный кабинет">
                                <button id="chatTab" type="button" role="tab" aria-selected="true" aria-controls="chatPanel">Подбор</button>
                                <button id="guardianshipsTab" type="button" role="tab" aria-selected="false" aria-controls="guardianshipsPanel" tabindex="-1">Мои подопечные</button>
                            </div>
                            <section id="chatPanel" class="chat-panel" role="tabpanel" aria-labelledby="chatTab">
                                <div id="chatMessage" class="chatMessage" role="log" aria-label="Сообщения"></div>
                                <form class="chatUserInput hidden" id="chatInputArea">
                                    <input type="text" id="userInput" data-request-control aria-label="Сообщение" placeholder="Сообщение..." maxlength="2000" autocomplete="off" required>
                                    <button id="sendMessage" data-request-control type="submit">Отправить!</button>
                                </form>
                            </section>
                            <section id="guardianshipsPanel" class="guardianships-panel hidden" role="tabpanel" aria-labelledby="guardianshipsTab" tabindex="0">
                                <p id="guardianshipStatus" role="status"></p>
                                <button id="guardianshipRetry" class="text-btn hidden" data-request-control type="button">Повторить загрузку</button>
                                <div id="guardianshipList" class="pet-list"></div>
                            </section>
                            <footer class="account-footer">
                                <p id="sessionStatus" role="status"></p>
                                <button id="signOut" class="text-btn" data-request-control type="button">Выйти из аккаунта</button>
                            </footer>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <dialog id="subscriptionDialog" aria-labelledby="subscriptionTitle" aria-describedby="subscriptionDescription">
            <form id="subscriptionForm">
                <h2 id="subscriptionTitle"></h2>
                <p id="subscriptionDescription"></p>
                <p id="subscriptionStatus" role="status"></p>
                <div class="subscription-actions">
                    <button id="subscriptionClose" type="button" data-request-control autofocus>Отмена</button>
                    <button id="subscriptionPay" type="submit" data-request-control>Оплатить подписку</button>
                </div>
            </form>
        </dialog>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
